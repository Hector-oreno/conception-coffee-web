<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo | Conception Coffee</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/usuarios/login.css">

    <link
        rel="icon"
        type="image/png"
        href="/images/branding/isotipo.png"
    >
    
</head>
<body>

    <div class="login-card">

        <div class="login-brand-logo">

            <img
                src="/images/branding/isotipo.png"
                alt="Conception Coffee"
            >

        </div>

        <h2>Conception Admin</h2>
        <p>Ingresa tus credenciales para acceder al panel</p>
        
        <form id="form-login">
            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" placeholder="heoreno@conceptioncoffee.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••••••" required>
            </div>

            <button type="submit" class="btn-login">
                <i class="fas fa-lock"></i> Iniciar Sesión
            </button>
        </form>

        <p class="privacy-notice">
            <i class="fas fa-shield-alt"></i> <strong>Aviso de Seguridad y Privacidad:</strong><br>
            Al iniciar sesión, aceptas que tu dirección IP, dispositivo y tiempos de actividad sean monitoreados y registrados con fines de auditoría y protección de accesos.
        </p>


    </div>

    <script src="js/usuarios/login.js"></script>
</body>
</html>
